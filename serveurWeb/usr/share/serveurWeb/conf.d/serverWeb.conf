<webconf>
    <site>
        <port>7070</port>
        <DocumentRoot>var/site1</DocumentRoot>
        <Acceslog>var/log/site1/access.log</Acceslog>
        <Errorlog>var/log/site1/error.log</Errorlog>
    </site>
    <site>
        <port>8070</port>
        <DocumentRoot>var/site2</DocumentRoot>
        <DefaultIndex>index.html</DefaultIndex>
        <Acceslog>var/log/site2/access.log</Acceslog>
        <Errorlog>var/log/site2/error.log</Errorlog>
    </site>
    <site>
        <port>8080</port>
        <DocumentRoot>var/site3</DocumentRoot>
        <Acceslog>var/log/site3/access.log</Acceslog>
        <Errorlog>var/log/site3/error.log</Errorlog>
    </site>
</webconf>